<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get Quests</title>
  <meta name="description" content="Download Quests for iPhone, iPad or Android.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://thequestsapp.com/share">
  <script id="download-redirect">
    // Run before styles and body content, without waiting for a script download.
    (function () {
      var ua = (navigator.userAgent || '').toLowerCase();
      var platform = /android/.test(ua) ? 'android'
        : /iphone|ipad|ipod/.test(ua) || (/mac/.test(ua) && navigator.maxTouchPoints > 1) ? 'ios' : 'desktop';
      document.documentElement.dataset.device = platform;
      if (platform === 'ios') window.location.replace('https://apps.apple.com/us/app/quests-social-habit-tracking/id6745767553');
      else if (platform === 'android') window.location.replace('https://play.google.com/store/apps/details?id=info.nothingserious.quests');
    })();
  </script>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #252525; background: #fff; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { max-width: 340px; text-align: center; }
    h1 { font-size: 24px; margin: 0 0 12px; font-weight: 600; }
    p { font-size: 15px; line-height: 1.5; color: #626262; margin: 0 0 20px; }
    img { display: block; width: 220px; height: 220px; margin: 0 auto 20px; }
    nav { display: flex; justify-content: center; gap: 24px; }
    a { color: #252525; font-size: 15px; text-underline-offset: 3px; padding: 12px 0; }
    a:focus-visible { outline: 2px solid #252525; outline-offset: 5px; }
    .mobile-status { display: none; }
    html[data-device="ios"] .desktop-content, html[data-device="android"] .desktop-content { display: none; }
    html[data-device="ios"] .mobile-status, html[data-device="android"] .mobile-status { display: block; }
    html[data-device="ios"] .android, html[data-device="android"] .ios { display: none; }
  </style>
</head>
<body data-download-page>
  <main>
    <div class="desktop-content">
      <h1>Get Quests on your phone</h1>
      <p>Scan with your phone’s camera.</p>
      <img src="/assets/img/download-qr.svg?v=3" width="220" height="220" alt="Scan to open Quests in your phone’s app store">
    </div>
    <p class="mobile-status" role="status">Opening <span class="ios">the App Store</span><span class="android">Google Play</span>…</p>
    <nav aria-label="Open your app store">
      <a class="ios" href="https://apps.apple.com/us/app/quests-social-habit-tracking/id6745767553">Open App Store</a>
      <a class="android" href="https://play.google.com/store/apps/details?id=info.nothingserious.quests">Open Google Play</a>
    </nav>
  </main>
</body>
</html>
