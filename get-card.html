</section>

  <section class="section">
    <div class="shell container--narrow">
      <div class="card wallet-card reveal">
        <div class="wallet-preview">

          <div class="wallet-preview__qr">
            <img id="qr-code-image" src="" width="200" height="200" alt="QR code that links to the Quests download page">
          </div>

        <p class="wallet-caption">Scan the code to download the app</p>

<script>
  // Generate the Wallet card preview QR, pointed at the App Store listing.
  (function () {
    var appStoreUrl = 'https://apps.apple.com/us/app/quests-social-habit-tracking/id6745767553';
    var qrCodeUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(appStoreUrl);
    var qrImg = document.getElementById('qr-code-image');
    if (qrImg) {
      qrImg.src = qrCodeUrl;
      qrImg.onerror = function () {
        this.style.display = 'none';
        this.parentElement.innerHTML = '<div class="wallet-preview__qr-placeholder">QR Code<br>Links to App Store</div>';
      };
    }
  })();

  // iOS Safari Wallet pass handling: let iOS open the .pkpass natively.
  if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
    var walletLink = document.querySelector('a[href*=".pkpass"]');
    if (walletLink) {
      walletLink.addEventListener('click', function (e) {
        // Don't prevent default, iOS handles the pass natively.
      });
    }
  }
</script>
